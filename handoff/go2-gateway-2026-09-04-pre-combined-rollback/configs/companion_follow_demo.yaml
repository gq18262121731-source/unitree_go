# Go2 Companion Follow V1 field profile for the 3 m x 3 m demo area.
# Edit values only while the robot is disarmed, then restart the supervised run.
follow:
  target_distance_m: 1.75
  target_bearing_deg: 18.435
  start_distance_m: 1.90
  stop_distance_m: 1.70

  walk_min_mps: 0.20
  vx_max_mps: 0.30
  wz_max_radps: 0.30

  bearing_deadband_deg: 12
  person_stop_hold_s: 1.5
  uwb_timeout_s: 2.0

  # Advanced values should normally remain frozen during field tuning.
  control_frequency_hz: 10
  hard_min_distance_m: 1.0
  hard_max_distance_m: 2.5
  kx: 0.20
  ky: 0.80

lidar:
  slow_distance_m: 1.40
  stop_distance_m: 0.80
  slow_scale: 0.35
  roi_min_z_m: -0.25
  roi_width_m: 0.90

  # Existing guard behavior remains unchanged.
  roi_min_x_m: 0.10
  roi_max_x_m: 2.00
  roi_max_z_m: 0.65
  stale_timeout_s: 0.35
  minimum_cloud_points: 10
  minimum_obstacle_points: 3
  clear_samples_required: 3

view_adjust:
  enabled: true
  max_wz_radps: 0.20
  target_bearing_deg: 0
  deadband_deg: 8
  gain: 0.80

safety:
  # V1 validation rejects false; fall/preemption recovery must stay manual.
  require_manual_resume_after_preempt: true
  watchdog_s: 0.5
